<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman - Labersa Riau Fantasi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins', sans-serif;
    background: linear-gradient(135deg,#2b0b5e,#5f1fbf);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:#333;
}

/* Lampu Ramadhan */
.lanterns{
    position:absolute;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-evenly;
    pointer-events:none;
}

.lantern{
    width:45px;
    height:75px;
    background:radial-gradient(circle,#ffd54f 40%,#ff9800 100%);
    border-radius:25px;
    position:relative;
    animation:glow 2s infinite alternate ease-in-out;
}

.lantern::before{
    content:"";
    position:absolute;
    top:-45px;
    left:50%;
    width:2px;
    height:45px;
    background:#fff;
    transform:translateX(-50%);
}

@keyframes glow{
    from{box-shadow:0 0 8px #ffd54f;}
    to{box-shadow:0 0 25px #ffc107;}
}

/* Card */
.card{
    background:#fff;
    max-width:700px;
    width:100%;
    border-radius:20px;
    padding:60px 40px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    position:relative;
    z-index:1;
}

.badge{
    display:inline-block;
    background:#f5c542;
    padding:8px 18px;
    border-radius:30px;
    font-weight:600;
    margin-bottom:15px;
    font-size:14px;
}

h1{
    font-size:30px;
    color:#2b0b5e;
    font-weight:700;
    margin-bottom:5px;
}

h2{
    font-size:22px;
    color:#d84315;
    margin-bottom:20px;
}

.date{
    background:#2b0b5e;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-weight:500;
    margin-bottom:20px;
    display:inline-block;
}

.message{
    font-size:16px;
    font-weight:500;
    margin-bottom:25px;
}

/* WhatsApp Buttons */
.wa-title{
    font-weight:600;
    margin-bottom:12px;
}

.wa-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.wa-btn{
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    transition:0.3s;
}

.wa-btn:hover{
    background:#1ebe5d;
}

.footer{
    background:#f5c542;
    padding:12px;
    border-radius:8px;
    font-weight:600;
}

@media(max-width:600px){
    .card{padding:50px 25px;}
    h1{font-size:24px;}
    h2{font-size:18px;}
    .lantern{width:35px;height:60px;}
}
</style>
</head>
<body>

<div class="lanterns">
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
</div>

<div class="card">

    <div class="badge">Menyambut Bulan Suci Ramadhan</div>

    <h1>LABERSA RIAU FANTASI</h1>
    <h2>TUTUP SEMENTARA</h2>

    <div class="date">
        Mulai 19 Februari s/d H-5 sebelum Lebaran
    </div>

    <div class="message">
        Selama bulan puasa kami melaksanakan maintenance.
    </div>

    <div class="wa-title">Informasi Lebih Lanjut:</div>

    <div class="wa-buttons">
        <a class="wa-btn" href="https://wa.me/628117696599" target="_blank">
            Hendra 
        </a>
        <a class="wa-btn" href="https://wa.me/628117673499" target="_blank">
            Dedi 
        </a>
    </div>

    <div class="footer">
        Selamat Menunaikan Ibadah Puasa 1447 H
    </div>

</div>

</body>
</html>
