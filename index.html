<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo Riau Fantasi Labersa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f5f7fb;
}
.hero{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  padding:40px 20px;
  text-align:center;
}
.hero h1{margin:0;font-size:28px;font-weight:700;}
.hero p{margin-top:10px;font-size:14px;opacity:.9}
.badge{
  display:inline-block;
  background:#ffeb3b;
  color:#000;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  margin-top:10px;
}
.container{
  max-width:520px;
  margin:-30px auto 30px;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.1);
}
.price-box{
  text-align:center;
  background:#f1f8ff;
  padding:20px;
  border-radius:16px;
}
.price-box h2{
  margin:0;
  font-size:32px;
  color:#0072ff;
}
.info{
  margin-top:15px;
  font-size:14px;
}
.list{
  margin-top:20px;
  background:#fff8e1;
  padding:15px;
  border-radius:12px;
  font-size:14px;
}
label{
  display:block;
  margin-top:15px;
  font-weight:600;
}
input,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#25D366,#128C7E);
  color:#fff;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
}
button:hover{opacity:.9}
.footer{
  text-align:center;
  font-size:13px;
  color:#777;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>🎟️ PROMO GOBER</h1>
  <p>Go Booking Online Lebaran Riau Fantasi</p>
  <div class="badge">WAJIB BOOKING</div>
</div>

<div class="container">

  <div class="price-box">
    <h2>Rp40.000</h2>
    <div class="info">
      Senin - Minggu<br>
      ⏰ 09.00 - 18.00<br>
      📅 21 - 29 Maret 2026
    </div>
  </div>

  <div class="list">
    ✅ Pembayaran tunai saat kunjungan<br>
	✅ Anak dibawah 80 cm GRATIS<br>
    ✅ Termasuk wahana baru<br>
    ✅ Wajib booking H-1<br>
    ⚠️ Menunjukkan bukti booking
  </div>

  <form onsubmit="sendToWA(); return false;">
    <label>Nama</label>
    <input type="text" id="nama" required>

    <label>No WhatsApp</label>
    <input type="tel" id="nomor" required>

    <label>Tanggal</label>
    <input type="date" id="tanggal" required>

    <label>Jumlah Tiket</label>
    <input type="number" id="jumlah" value="1" min="1" required>

    <label>Catatan</label>
    <textarea id="catatan"></textarea>

    <button type="submit">📲 Booking Sekarang</button>
  </form>

  <div class="footer">
    © 2026 Riau Fantasi Labersa
  </div>

</div>

<script>
function sendToWA(){
  const nama = document.getElementById("nama").value;
  const nomor = document.getElementById("nomor").value;
  const tanggal = document.getElementById("tanggal").value;
  const jumlah = document.getElementById("jumlah").value;
  const catatan = document.getElementById("catatan").value || "-";

  const t = tanggal.split("-");
  const tgl = t[2] + "-" + t[1] + "-" + t[0];

  const pesan =
    "Halo Riau Fantasi Labersa!%0A%0A" +
    "Booking PROMO GOBER Rp40.000%0A%0A" +
    "Nama: " + nama + "%0A" +
    "No HP: " + nomor + "%0A" +
    "Tanggal: " + tgl + "%0A" +
    "Jumlah: " + jumlah + "%0A" +
    "Catatan: " + catatan + "%0A%0A" +
    "Info Penting:%0A" +
    "- Berlaku 21-29 Maret 2026%0A" +
    "- Anak dibawah 80cm Gratis%0A" +
	"- Pembayaran tunai saat kunjungan" +
    "- Wajib menunjukkan bukti booking";

  window.open("https://wa.me/628117696599?text=" + pesan);
}
</script>

</body>
</html>
